<!doctype html>
<html lang="fr" data-theme="nordique" data-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma Bibliothèque</title>
<meta name="description" content="Bibliothèque numérique personnelle — ebooks et livres audio.">
<meta name="theme-color" content="#f4f1ec">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<!-- Thème appliqué avant le premier rendu, pour éviter un flash de la mauvaise couleur -->
<script>
(function(){
  try{
    var t = localStorage.getItem('mabiblio.theme');
    var m = localStorage.getItem('mabiblio.mode');
    if (t) document.documentElement.setAttribute('data-theme', t);
    if (m) document.documentElement.setAttribute('data-mode', m);
  }catch(e){}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Archivo:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Libre+Franklin:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=Spectral:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ?v= = numéro de version (APP_VERSION dans js/app.js) : à changer à chaque livraison,
     pour obliger les navigateurs (iPhone compris) à recharger les nouveaux fichiers -->
<link rel="stylesheet" href="css/style.css?v=1.6">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand-row">
      <a href="#/" class="brand">Ma Bibliothèque</a>
      <span class="brand-stats" id="brand-stats"></span>
      <div class="hdr-btns">
        <button id="carnet-btn" class="icon-btn" type="button" aria-label="Mon carnet de lecture" title="Mon carnet de lecture" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v18"/><path d="M12.5 8H16"/><path d="M12.5 12H16"/></svg>
        </button>
      <button id="settings-btn" class="icon-btn gear" type="button" aria-label="Réglages" title="Réglages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      </div>
    </div>

    <div class="controls" id="controls">
      <div class="field search-wrap">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" type="text" enterkeyhint="search" placeholder="Auteur ou titre…" autocomplete="off">
        <button type="button" id="search-clear" class="search-clear" aria-label="Effacer la recherche" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="field field-select">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2z"/><path d="M22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z"/></svg>
        <select id="filter-format" aria-label="Format">
          <option value="">Tous formats</option>
          <option value="ebook">Ebook</option>
          <option value="pdf">PDF</option>
          <option value="audio">Audio</option>
        </select>
      </div>
      <div class="field field-select">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v5h5"/></svg>
        <select id="filter-genre" aria-label="Genre">
          <option value="">Tous genres</option>
        </select>
      </div>
      <div class="status-pills" id="status-pills" role="group" aria-label="Statut">
        <button type="button" class="pill" data-status="read">Lus</button>
        <button type="button" class="pill" data-status="listened">Écoutés</button>
        <button type="button" class="pill" data-status="inprogress">En cours</button>
        <button type="button" class="pill" data-status="unread">Non lus</button>
        <button type="button" class="pill" data-status="favorite">★ Favoris</button>
      </div>
    </div>
  </div>
</header>

<main id="app">
  <div class="loading">Chargement de la bibliothèque…</div>
</main>

<div id="lightbox" class="lightbox hidden">
  <button id="lightbox-close" class="lightbox-close" aria-label="Fermer">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js?v=1.6"></script>
</body>
</html>
