<!doctype html>
<html lang="fr" data-theme="nordique" data-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma Bibliothèque</title>
<meta name="description" content="Bibliothèque numérique personnelle — ebooks et livres audio.">
<meta name="theme-color" content="#f4f1ec">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<!-- Thème appliqué avant le premier rendu, pour éviter un flash de la mauvaise couleur -->
<script>
(function(){
  try{
    var t = localStorage.getItem('mabiblio.theme');
    var m = localStorage.getItem('mabiblio.mode');
    if (t) document.documentElement.setAttribute('data-theme', t);
    if (m) document.documentElement.setAttribute('data-mode', m);
  }catch(e){}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Libre+Franklin:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=Spectral:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-top">
    <div class="brand-block">
      <a href="#/" class="brand">Ma Bibliothèque</a>
      <span class="brand-stats" id="brand-stats"></span>
    </div>
    <button id="settings-btn" class="icon-btn gear" aria-label="Réglages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div class="controls" id="controls">
    <div class="search-wrap">
      <input type="search" id="search-input" placeholder="Auteur ou titre…" autocomplete="off">
      <button type="button" id="search-clear" class="search-clear" aria-label="Effacer la recherche" hidden>✕</button>
    </div>
    <select id="filter-format" aria-label="Format">
      <option value="">Tous formats</option>
      <option value="ebook">Ebook</option>
      <option value="pdf">PDF</option>
      <option value="audio">Audio</option>
    </select>
    <select id="filter-genre" aria-label="Genre">
      <option value="">Tous genres</option>
    </select>
    <div class="status-pills" id="status-pills" role="group" aria-label="Statut">
      <button type="button" class="pill" data-status="favorite">★ Favoris</button>
      <button type="button" class="pill" data-status="read">Lus</button>
      <button type="button" class="pill" data-status="listened">Écoutés</button>
      <button type="button" class="pill" data-status="unread">Non lus</button>
    </div>
  </div>
</header>

<main id="app">
  <div class="loading">Chargement de la bibliothèque…</div>
</main>

<div id="lightbox" class="lightbox hidden">
  <button id="lightbox-close" class="lightbox-close" aria-label="Fermer">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
